[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "promarkia-community"
version = "0.1.0"
description = "Full local, approval-first Promarkia workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiofiles>=24,<25",
  "alembic>=1.16,<2",
  "anthropic>=0.52,<1",
  "autogen-agentchat==0.6.4",
  "autogen-core==0.6.4",
  "autogen-ext[openai,mcp,web-surfer]==0.6.4",
  "beautifulsoup4>=4.13,<5",
  "composio>=0.11,<1",
  "fastapi>=0.115,<1",
  "google-genai>=1.50,<2",
  "html2text>=2025.4.15",
  "cryptography>=50,<51",
  "croniter>=6,<7",
  "httpx>=0.27,<1",
  "loguru>=0.7,<1",
  "matplotlib>=3.10,<4",
  "mcp>=1.19,<2",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2.2,<3",
  "openai>=1.90,<3",
  "pandas>=2.2,<3",
  "pillow>=12.3,<13",
  "python-pptx>=1,<2",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.8,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "seaborn>=0.13,<1",
  "sqlmodel>=0.0.24,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
promarkia = "promarkia_local.launcher:main"
promarkia-desktop = "promarkia_local.launcher:main"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["autogenstudio*", "promarkia_local*"]

[tool.setuptools.package-data]
promarkia_local = ["squads.json"]
autogenstudio = ["web/ui/**/*", "gallery/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
