name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.1.0
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: macos-14
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned build dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-build.lock
          python -m pip install --no-deps .
      - name: Build full local web application
        run: python scripts/build_full_local.py
      - name: Build desktop application
        run: |
          python -m pip install -r requirements-security.lock
          python -m pip_audit -r requirements.lock --format cyclonedx-json --output sbom.cdx.json
          python scripts/build_release_metadata.py
          pyinstaller --noconfirm --clean packaging/PromarkiaCommunity.spec
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $required = @(
            $env:WINDOWS_CERTIFICATE_BASE64,
            $env:WINDOWS_CERTIFICATE_PASSWORD
          )
          $provided = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($provided -eq 0) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              throw 'Tagged releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD.'
            }
            'WINDOWS_SIGNING_AVAILABLE=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Unsigned Windows artifact allowed for this manual test run.'
            exit 0
          }
          if ($provided -ne $required.Count) {
            throw 'Windows signing credentials are incomplete.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'promarkia-windows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
          } catch {
            throw 'WINDOWS_CERTIFICATE_BASE64 is not valid base64.'
          }
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'signtool.exe was not found on the Windows runner.' }
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_SIGNTOOL=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'WINDOWS_SIGNING_AVAILABLE=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign Windows application
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $target = '.\dist\PromarkiaCommunity\PromarkiaCommunity.exe'
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw 'Windows application signing failed.' }
          & $env:WINDOWS_SIGNTOOL verify /pa /v $target
          if ($LASTEXITCODE -ne 0) { throw 'Windows application signature verification failed.' }
      - name: Prepare macOS code signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          required=(
            "$MACOS_CERTIFICATE_P12_BASE64"
            "$MACOS_CERTIFICATE_PASSWORD"
            "$MACOS_SIGNING_IDENTITY"
            "$APPLE_API_KEY_P8"
            "$APPLE_API_KEY_ID"
            "$APPLE_API_ISSUER_ID"
          )
          provided=0
          for value in "${required[@]}"; do
            [[ -n "$value" ]] && provided=$((provided + 1))
          done
          if [[ "$provided" -eq 0 ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo 'Tagged releases require the complete macOS signing and App Store Connect API credential set.' >&2
              exit 1
            fi
            echo 'MACOS_SIGNING_AVAILABLE=false' >> "$GITHUB_ENV"
            echo 'Unsigned macOS artifact allowed for this manual test run.'
            exit 0
          fi
          if [[ "$provided" -ne "${#required[@]}" ]]; then
            echo 'macOS signing or notarization credentials are incomplete.' >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/promarkia-macos-signing.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/promarkia-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$MACOS_SIGNING_IDENTITY"
          echo "MACOS_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo 'MACOS_SIGNING_AVAILABLE=true' >> "$GITHUB_ENV"
      - name: Sign macOS application
        if: runner.os == 'macOS' && env.MACOS_SIGNING_AVAILABLE == 'true'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "dist/Promarkia Community.app"
          codesign --verify --deep --strict --verbose=2 "dist/Promarkia Community.app"
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $compiler = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'NSIS compiler was not installed' }
          & $compiler "/DAPP_VERSION=${{ steps.version.outputs.value }}" packaging/windows-installer.nsi
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $target = (Get-ChildItem release\*-Setup.exe | Select-Object -First 1).FullName
          & $env:WINDOWS_SIGNTOOL sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $env:WINDOWS_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer signing failed.' }
          & $env:WINDOWS_SIGNTOOL verify /pa /v $target
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer signature verification failed.' }
      - name: Smoke-test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PROMARKIA_NO_BROWSER='1'
          $process=Start-Process '.\dist\PromarkiaCommunity\PromarkiaCommunity.exe' -PassThru
          try {
            for($i=0;$i -lt 30;$i++) {
              try { Invoke-RestMethod 'http://127.0.0.1:8788/api/health'; break }
              catch { Start-Sleep -Milliseconds 500 }
            }
            if($i -eq 30) { throw 'Desktop health check failed' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: Audit Windows installer contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*-Setup.exe | Select-Object -First 1
          $auditRoot = Join-Path $env:RUNNER_TEMP 'PromarkiaCommunityAudit'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$auditRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer audit install failed: $($install.ExitCode)" }
          if (-not (Test-Path -LiteralPath $auditRoot)) { throw 'Installer audit directory was not created' }
          python scripts/verify_release_bundle.py $auditRoot
      - name: Build and smoke-test macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          PROMARKIA_NO_BROWSER=1 "dist/Promarkia Community.app/Contents/MacOS/PromarkiaCommunity" &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8788/api/health && break
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8788/api/health >/dev/null
          kill $app_pid
          trap - EXIT
          mkdir -p release
          hdiutil create -volname "Promarkia Community" -srcfolder "dist/Promarkia Community.app" -ov -format UDZO "release/Promarkia-Community-${{ steps.version.outputs.value }}-macOS.dmg"
          if [[ "$MACOS_SIGNING_AVAILABLE" == "true" ]]; then
            dmg="release/Promarkia-Community-${{ steps.version.outputs.value }}-macOS.dmg"
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg"
            codesign --verify --verbose=2 "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          fi
          audit_mount="$RUNNER_TEMP/promarkia-community-dmg"
          mkdir -p "$audit_mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$audit_mount" "release/Promarkia-Community-${{ steps.version.outputs.value }}-macOS.dmg"
          python scripts/verify_release_bundle.py "$audit_mount"
          hdiutil detach "$audit_mount"
      - name: Remove Windows signing credentials
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
      - name: Remove macOS signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
          rm -f "${MACOS_CERTIFICATE_PATH:-}" "${APPLE_API_KEY_PATH:-}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Build release SBOM and notices
        run: |
          python -m pip install -r requirements.lock -r requirements-build.lock -r requirements-security.lock
          python -m pip_audit -r requirements.lock --format cyclonedx-json --output release/SBOM.cdx.json
          python scripts/build_release_metadata.py --sbom release/SBOM.cdx.json
          cp LICENSE THIRD_PARTY_NOTICES.md release/
      - name: Create checksums
        run: find release -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Promarkia Community $GITHUB_REF_NAME"
